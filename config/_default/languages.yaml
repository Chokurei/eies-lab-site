# Bilingual site: English at /, Chinese at /zh/.
# Content translations use filename suffixes (e.g. _index.zh.md);
# author translations live in data/zh/authors/<slug>.yaml.
# Menu urls are written without a leading slash (research/, ./ for home): the theme adds the
# language and site base, e.g. /eies-lab-site/zh/research/ on GitHub Pages. A leading slash breaks this.

en:
  label: English
  locale: en-us
  weight: 1
  menus:
    main:
      - { name: Home, url: ./, weight: 10 }
      - { name: Research, url: research/, weight: 20 }
      - { name: Publications, url: publications/, weight: 30 }
      - { name: Team, url: team/, weight: 40 }
      - { name: News, url: news/, weight: 50 }
      - { name: Spaces, url: spaces/, weight: 60 }
      - { name: Contact, url: contact/, weight: 70 }

zh:
  label: 中文
  locale: zh-cn
  weight: 2
  title: EIES-Lab
  menus:
    main:
      - { name: 首页, url: ./, weight: 10 }
      - { name: 研究方向, url: research/, weight: 20 }
      - { name: 论文, url: publications/, weight: 30 }
      - { name: 团队, url: team/, weight: 40 }
      - { name: 新闻, url: news/, weight: 50 }
      - { name: 实验室空间, url: spaces/, weight: 60 }
      - { name: 联系我们, url: contact/, weight: 70 }
