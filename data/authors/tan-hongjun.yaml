bio: >-
  I am an interdisciplinary researcher working across climate change, renewable
  energy, artificial intelligence, and urban sustainability, with expertise in
  AI, generative AI, remote sensing, GIS, photovoltaics, and data-driven
  modelling. My strength lies in connecting advanced computational approaches
  with real-world energy and sustainability challenges, supported by a strong
  track record of interdisciplinary research and publication. 


  I have gained international research experience at the Environmental Change
  Institute (ECI), University of Oxford, supported by the competitive RSAP and
  ICRF Scholarships. This experience has further shaped my ability to work
  across disciplines, institutions, and international research environments.


  Beyond research, I built strong leadership, communication, and organizational
  skills. I have organized and supported 10+ international conferences across
  the UK, Qatar, Japan, South Korea, Thailand, and beyond, with individual
  events attracting up to 600 participants. My experience also extends to
  academic publishing and peer-review coordination.


  Outside academia, 5+ years of dance teaching and 3+ years of scuba diving have
  strengthened my communication, adaptability, creativity, and teamwork. 


  Together, these experiences allow me to bring scientific expertise, technical
  capability, international perspective, and people-centered leadership to
  collaborative and interdisciplinary environments.
