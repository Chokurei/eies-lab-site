bio: >-
  I am an MPhil student in the Department of Building Environment and Energy
  Engineering at The Hong Kong Polytechnic University, supervised by Prof.
  Jinyue Yan and Dr. Zhiling Guo. I received my bachelor’s degree in Computer
  Science and Technology from Southern University of Science and Technology.


  My research combines deep learning, 3D computer vision, and urban energy
  modelling, with a focus on city-scale rooftop photovoltaic potential
  assessment. I develop efficient predictive models using urban geometry,
  meteorological data, and physical simulation. My current interests also
  include active perception and automated building information modelling for
  urban digital twins and climate resilience applications.
bio_zh: |-
  我现为香港理工大学建筑环境及能源工程学系研究型硕士生，在严晋跃教授和郭直灵老师的共同指导下开展研究。本科毕业于南方科技大学计算机科学与技术专业。

  我的研究结合深度学习、三维计算机视觉与城市能源建模，重点开展城市尺度屋顶光伏潜力评估，通过融合城市三维几何、气象数据与物理模拟，构建高效的预测模型。目前也在探索主动感知与建筑信息模型自动重建，面向城市数字孪生与气候韧性应用。
