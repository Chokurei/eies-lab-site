bio: Yuhan Liu is a second-year Master student in the computer science
  department at University of Copenhagen. He used to study at Southern
  Univerisity of Science and Technology. His early research primarily focused on
  human computer interaction, while his current research is mainly about remote
  sensing, especially physic-grounded world models and PV output
  forecasting.  He has published several works on international conferences such
  as Applied Energy and CHI's Workshop.
