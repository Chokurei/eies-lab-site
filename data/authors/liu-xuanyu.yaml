bio: I am a PhD student in the Department of Building Environment and Energy
  Engineering at The Hong Kong Polytechnic University. I received my bachelor’s
  and master’s degrees from Tongji University. My research focuses on low-carbon
  urban energy and transportation systems, particularly electric vehicle
  charging demand, integrated solar–storage–charging systems, and urban carbon
  emissions. Outside research, I enjoy murder mystery games, singing, and
  teaming up with friends for online gaming.
bio_zh: 我目前是香港理工大学建筑环境及能源工程学系的博士研究生，本科和硕士均就读于同济大学。我的研究主要围绕城市能源与交通系统的低碳发展，关注电动汽车充电需求、光储充系统优化及城市碳排放。科研之外，我喜欢玩剧本杀、唱歌，也喜欢和朋友一起开黑。
