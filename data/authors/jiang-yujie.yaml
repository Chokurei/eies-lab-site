bio: >-
  Yujie Jiang is a first-year PhD student at The Hong Kong Polytechnic
  University (PolyU) and a member of EIES-Lab. He received his bachelor’s degree
  in Building Science and Engineering with a Secondary Major in Artificial
  Intelligence and Data Analytics from PolyU. 


  His research interests include physics-grounded world models and the dynamics
  of buildings and energy storage systems.
bio_zh: |-
  江宇杰现为香港理工大学 EIES-Lab 的一年级博士生。他本科毕业于香港理工大学，主修建筑科学及工程学，副主修人工智能及数据分析。

  研究兴趣包括基于物理的世界模型，以及建筑与储能动态。
