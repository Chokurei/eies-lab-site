bio: >-
  Zhengyuan Lin is a master’s student in Information Science and Technology at
  the University of Tokyo. He is also an AI research intern at Alaya Lab.

  Previously, he was a research assistant at the Hong Kong Polytechnic
  University, supervised by Prof. Zhiling Guo in DigiEnergy Lab.

  He is interested in intelligence that understands both the physical world and
  the human mind: models that can simulate how the world responds to actions,
  and read how people think and act. Before, he worked on generative AI for
  renewable energy.
