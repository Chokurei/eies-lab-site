bio: >-
  I received my M.S. degree in Artificial Intelligence from Northwestern
  Polytechnical University, Xi’an, China, in 2024. I am currently a joint Ph.D.
  candidate at The Hong Kong Polytechnic University, Hong Kong, China, and the
  Eastern Institute for Advanced Study, Ningbo, China. I specialize in data
  analysis and the construction of artificial intelligence systems, with an
  interdisciplinary research background covering artificial intelligence, energy
  engineering, and vehicular transportation. I have published several papers in
  peer-reviewed journals including IEEE TGRS, Renewable Energy, and IEEE RAL et.
  al.


  Outside of research, I keep an active lifestyle through outdoor activities,
  badminton, running and cycling. I have watched more than 1140 films, tracked
  on Douban platform, and am working toward my goal of watching over 2000 films.
  Photography has recently grown into my new passion.
