bio: I am Xuan Liao, a postdoctoral researcher at The Hong Kong Polytechnic
  University, where I obtained my PhD in Remote Sensing and GIS. My research
  focuses on GeoAI, remote sensing and GIS, with applications in solar energy
  potential assessment, infrastructure climate resilience, and coral reef
  monitoring. I am particularly interested in GeoAI for sustainable energy
  development and environmental protection.
bio_zh: 廖萱，现为香港理工大学博士后，获该校遥感与GIS博士学位。主要研究方向为地理空间人工智能、遥感与GIS，聚焦太阳能潜力评估、基础设施气候韧性及遥感应用。研究兴趣包括时空人工智能，致力于推动地理空间技术在可持续能源与生态环境保护中的应用
