bio: Ruizhe Deng is a third-year PhD candidate in the Department of Building
  Environment and Energy Engineering at The Hong Kong Polytechnic University. He
  used to study at China University of Geosciences (Wuhan) and Aerospace
  Information Research Institute, Chinese Academy of Sciences. His early
  research primarily focused on computer vision algorithms and intelligent
  remote sensing image interpretation, while his current research centers on
  artificial intelligence for energy systems, including photovoltaic power
  generation forecasting, photovoltaic mapping, and algorithm development for
  multimodal large language models. He has published over 10 papers in top
  journals and conferences, including ISPRS Journal of Photogrammetry and Remote
  Sensing, IEEE Transactions on Geoscience and Remote Sensing, Applied Energy,
  Renewable Energy, International Conference on Machine Learning.
bio_zh: 邓睿哲现为香港理工大学建筑环境与能源工程系博士三年级在读学生，曾学习于中国地质大学（武汉）与中国科学院空天信息创新研究院。其前期主要研究方向为计算机视觉与遥感图像智能解译算法，现阶段聚焦人工智能赋能能源领域（AI
  for
  Energy）的前沿研究，主要包括光伏发电出力预测、光伏智能测图以及多模态大模型算法研发与应用。目前已在国内外高水平期刊及会议累计发表论文十余篇，发表成果涵盖《ISPRS
  Journal of Photogrammetry and Remote Sensing》《IEEE Transactions on Geoscience
  and Remote Sensing》《Applied Energy》《Renewable Energy》《International Conference
  on Machine Learning》以及《测绘学报》等权威刊源。
