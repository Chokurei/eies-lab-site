# The lab's closed loop: single source for the homepage "Our Approach" diagram (layouts/_partials/hbx/blocks/loop-diagram).
# a · the physical energy environment sends observations to b · the embodied agent: perception → world model → decision,
# planning through imagined rollouts; physical action changes the environment, and physical feedback (reward, cost,
# safety) returns to the agent, updating its world model and decision policy.
system: { en: Physical energy environment, zh: 物理能源环境 }
# Labels on the environment drawing (key = position in the template).
system_items:
  - { key: sun, en: Solar radiation, zh: 太阳辐射 }
  - { key: city, en: 3D city, zh: 三维城市 }
  - { key: pv, en: PV, zh: 光伏 }
  - { key: grid, en: Grid, zh: 电网 }
  - { key: load, en: Building loads, zh: 建筑负荷 }
  - { key: storage, en: Storage, zh: 储能 }
  - { key: ev, en: EV, zh: 电动汽车 }
  - { key: drone, en: Low-altitude, zh: 低空 }
agent: { en: Embodied agent, zh: 具身智能体 }
links:
  observe: { en: Observations, zh: 观测 }
  observe_sub: { en: real-time data, zh: 实时数据 }
  feedback: { en: Physical feedback, zh: 物理反馈 }
  feedback_sub: { en: 'reward · cost · safety', zh: 奖励 · 成本 · 安全 }
  act: { en: Action, zh: 行动 }
  rollout: { en: 'Rollout · planning', zh: 想象推演 / 规划 }
# The agent's modules in loop order (two short lines each).
modules:
  - key: perceive
    en: Perception & state estimation
    zh: 感知与状态估计
    lines:
      en: [Multi-source partial observations, State estimate with uncertainty]
      zh: [多源观测 · 部分可观测, 状态估计与不确定性]
  - key: model
    en: World model
    zh: 世界模型
    lines:
      en: ['State · dynamics · observations', 'Physics, safety, consequences']
      zh: [状态表征 · 系统动力学 · 观测模型, 物理规律与安全约束 · 行动后果预测]
  - key: decide
    en: Decision & policy
    zh: 决策策略
    lines:
      en: ['Planning, control & safe decisions', 'Revenue · cost · resilience']
      zh: [规划与控制 · 安全决策, 目标优化（收益 / 成本 / 韧性）]
action: { en: Physical embodied action, zh: 物理具身行动 }
action_sub: { en: Acting on the real energy system, zh: 作用于真实能源系统 }
# icon = symbol key in the template
action_items:
  - { icon: sense, en: Active sensing, zh: 主动观测 }
  - { icon: control, en: Device control, zh: 设备控制 }
  - { icon: dispatch, en: Energy dispatch, zh: 能量调度 }
  - { icon: robot, en: Robot operation, zh: 机器人操作 }
# Read by screen readers in place of the drawing.
summary:
  en: >-
    a · The physical energy environment (solar radiation, a 3D city, PV, grid, building loads, storage, EVs and
    low-altitude drones) sends
    observations to b · the embodied agent. Perception estimates the system state; the world model predicts how the system
    evolves and what actions will cause; decision and policy plan through imagined rollouts and choose a safe action.
    Physical action (active sensing, device control, energy dispatch, robot operation) changes the environment, and
    physical feedback (reward, cost, safety) returns to the agent to update its world model and policy.
  zh: >-
    a · 物理能源环境（太阳辐射、三维城市、光伏、电网、建筑负荷、储能、电动汽车、低空无人机）把观测送给 b · 具身智能体：感知估计系统状态，
    世界模型预测系统演化与行动后果，决策策略先想象推演再选出安全的行动；物理具身行动（主动观测、设备控制、能量调度、机器人操作）
    改变环境，物理反馈（奖励、成本、安全）回到智能体，更新世界模型与策略。
